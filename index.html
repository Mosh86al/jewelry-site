<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תכשיטנות בעבודת יד</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --peach: #F7DED2;
    --peach-light: #FCEFE7;
    --cream: #FDF8F4;
    --pink: #DD5586;
    --pink-deep: #C23F6F;
    --gold: #E3B24C;
    --text: #55393F;
    --muted: #8A6E70;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--peach-light);
    background-image:
      radial-gradient(circle at 10% 8%, rgba(221,85,134,0.10), transparent 38%),
      radial-gradient(circle at 90% 88%, rgba(227,178,76,0.14), transparent 40%);
    color: var(--text);
    font-family: 'Heebo', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    overflow-x: hidden;
  }

  .stage {
    width: 100%;
    max-width: 640px;
    text-align: center;
    position: relative;
  }

  .sparkle {
    position: absolute;
    opacity: 0;
    animation: pop 0.6s ease-out forwards;
  }
  .sparkle svg { width: 100%; height: 100%; }
  .s1 { top: -18px; right: 8%; width: 22px; height: 22px; animation-delay: 0.9s; }
  .s2 { top: 40%; left: -6px; width: 16px; height: 16px; animation-delay: 1.05s; }
  .s3 { bottom: 6%; right: -4px; width: 18px; height: 18px; animation-delay: 1.2s; }

  .mark {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    opacity: 0;
    animation: rise 0.8s ease-out 0.1s forwards;
  }

  h1 {
    font-family: 'Rubik', sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 7vw, 42px);
    line-height: 1.25;
    color: var(--pink-deep);
    opacity: 0;
    animation: rise 0.8s ease-out 0.25s forwards;
  }

  .sub {
    margin-top: 14px;
    font-size: 15.5px;
    font-weight: 400;
    color: var(--muted);
    line-height: 1.7;
    max-width: 38ch;
    margin-inline: auto;
    opacity: 0;
    animation: rise 0.8s ease-out 0.4s forwards;
  }

  .rule {
    width: 70px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--gold), var(--pink));
    margin: 32px auto;
    opacity: 0;
    animation: rise 0.8s ease-out 0.5s forwards;
  }

  .contact-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 16px;
    opacity: 0;
    animation: rise 0.8s ease-out 0.45s forwards;
  }

  .phone {
    font-size: 26px;
    font-weight: 700;
    color: var(--pink-deep);
  }

  .icon-links {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--cream);
    border: 1px solid #F0D3C6;
    transition: border-color 0.25s ease, transform 0.25s ease;
  }

  .icon-btn:hover, .icon-btn:focus-visible {
    border-color: var(--pink);
    transform: translateY(-2px);
  }

  .icon-btn svg { width: 18px; height: 18px; }

  nav {
    display: flex;
    flex-direction: column;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }

  nav .tag:nth-of-type(5) { grid-column: 2 / span 2; }

  @media (max-width: 480px) {
    nav { grid-template-columns: repeat(2, 1fr); }
    nav .tag:nth-of-type(5) { grid-column: 1 / span 2; }
  }

  .tag {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 26px 16px;
    background: var(--cream);
    border: 1px solid #F0D3C6;
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(196,90,120,0.08);
    text-decoration: none;
    color: var(--text);
    text-align: center;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.7s ease-out forwards;
    transition: border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
  }

  .tag:nth-of-type(1) { animation-delay: 0.6s; }
  .tag:nth-of-type(2) { animation-delay: 0.7s; }
  .tag:nth-of-type(3) { animation-delay: 0.8s; }
  .tag:nth-of-type(4) { animation-delay: 0.9s; }
  .tag:nth-of-type(5) { animation-delay: 1.0s; }

  .tag:hover, .tag:focus-visible {
    border-color: var(--pink);
    transform: translateY(-2px);
    box-shadow: 0 10px 24px rgba(196,90,120,0.16);
  }

  .tag:focus-visible {
    outline: 2px solid var(--pink);
    outline-offset: 3px;
  }

  .tag .icon-wrap {
    flex-shrink: 0;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--peach-light);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tag .icon-wrap svg { width: 24px; height: 24px; }

  .tag .text { display: flex; flex-direction: column; align-items: center; }

  .tag .title {
    font-family: 'Rubik', sans-serif;
    font-size: 16.5px;
    font-weight: 700;
    color: var(--pink-deep);
    line-height: 1.3;
  }

  .tag .desc {
    font-size: 12.5px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 3px;
  }

  footer {
    margin-top: 36px;
    font-size: 11.5px;
    color: var(--muted);
    opacity: 0;
    animation: rise 0.8s ease-out 1.15s forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.4) rotate(-15deg); }
    to { opacity: 0.85; transform: scale(1) rotate(0deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .mark, h1, .sub, .rule, .tag, footer, .sparkle {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>
<body>

<div class="stage">

  <div class="sparkle s2"><svg viewBox="0 0 24 24" fill="none"><path d="M12 0L14 10L24 12L14 14L12 24L10 14L0 12L10 10L12 0Z" fill="#DD5586"/></svg></div>
  <div class="sparkle s3"><svg viewBox="0 0 24 24" fill="none"><path d="M12 0L14 10L24 12L14 14L12 24L10 14L0 12L10 10L12 0Z" fill="#E3B24C"/></svg></div>
